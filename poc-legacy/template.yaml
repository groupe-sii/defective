AWSTemplateFormatVersion: '2010-09-09'
Description: >
  This is a deployment that will setup resources needed in "WhatsApp integrated on AWS" solution

##########################################################################################
### Parameters
#########################################################################################
Parameters:
  S3BucketName:
    Type: String
    Description: The Bucket to store assets from this project
  S3BucketPath:
    Type: String
    Description: The path inside the bucket to store assets from this project
  LocaleConfig:
    Type: String
    Default: "en_US"
    Description: The locale configuration to be used by lambdas (values en_US, pt_BR, fr_FR)
  PythonVersion:
    Type: String
    Default: "3.11"
    Description: Python version
  MockChannels:
    Type: String
    Default: "whatsapp,sms,email,rcs"
    Description: >-
      Comma-separated channels kept in demo (mock) mode: replies are logged
      instead of sent. Channels removed from this list send for real and must
      be provisioned (WhatsApp number / SMS origination number / SES identity).
  FoundationModelParam:
      Type: String
      Default: "eu.amazon.nova-pro-v1:0"
      Description: Foundation model to be invoked on agent (must be an inference
        profile valid for the deployment region; eu-west-1 needs a eu.* profile,
        us.* profiles are rejected with ValidationException)
  KnowledgeBaseId:
    Type: String
    Default: "GXY5L19KJX"
    Description: Bedrock Knowledge Base holding the Non-Conformity Report history
  ExpertContacts:
    Type: String
    Default: "5511999998888"
    Description: >-
      Comma-separated phone numbers (E.164 digits, no +) of the conformity
      experts allowed to validate procedures in their chat with the agent
  MockEmail:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Demo mode. When true the contractor e-mail tool logs the message instead
      of sending it via SES

##########################################################################################
### Resources
#########################################################################################
Resources:

  #######################
  ### IAM Permissions
  #######################

  # Lambda function role that will process WhatsApp requests
  LambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Path: /
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: bedrock-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:*:*:foundation-model/*
                  - arn:aws:bedrock:*:*:inference-profile/*
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
        - PolicyName: messaging-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - social-messaging:SendWhatsAppMessage
                Resource:
                - !Sub arn:aws:social-messaging:${AWS::Region}:${AWS::AccountId}:phone-number-id/*
              - Effect: Allow
                Action:
                  - sms-voice:SendTextMessage
                Resource:
                - !Sub arn:aws:sms-voice:${AWS::Region}:${AWS::AccountId}:phone-number/*
                - !Sub arn:aws:sms-voice:${AWS::Region}:${AWS::AccountId}:configuration-set/*
        - PolicyName: dynamo-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhatsAppUserHistory
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhatsAppUserHistory/index/PhoneNumberDayIndex
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/NonConformityCases
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/NonConformityCases/index/*
        - PolicyName: email-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  #######################
  ### Infrastructure Resource Block
  #######################

  # DynamoDB Table to store history
  UserHistoryDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "WhatsAppUserHistory"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: "phone_number"
          KeyType: "HASH"
        - AttributeName: day
          KeyType: "RANGE"
      AttributeDefinitions:
        - AttributeName: "phone_number"
          AttributeType: "S"
        - AttributeName: "day"
          AttributeType: "S"


  # Lambda function that will interact with WhatsApp
  WhatsAppLambdaProcessor:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key:
          !Join
            - ''
            -
              - !Ref S3BucketPath
              - "/lambda.zip"
      FunctionName: WhatsApp-Aws-Integration-Main
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: !Ref PythonVersion
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          USER_HISTORY_TABLE: !Ref UserHistoryDynamoDBTable
          LOCALE: !Ref LocaleConfig
          CASES_TABLE: !Ref CasesDynamoDBTable
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          EXPERT_CONTACTS: !Ref ExpertContacts
          MOCK_EMAIL: !Ref MockEmail
          DEFAULT_MODEL: !Ref FoundationModelParam
          MOCK_CHANNELS: !Ref MockChannels


  # Permisson for SNS to invoke Lambda
  LambdaFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt WhatsAppLambdaProcessor.Arn
      Principal: sns.amazonaws.com
      SourceArn: !Ref WhatsAppAWSTopic


  # Customer-managed KMS key for SSE on WhatsAppAWSTopic.
  #
  # AWS End User Messaging Social (the WhatsApp publisher) must be granted
  # kms:GenerateDataKey* and kms:Decrypt on the topic's encryption key. The
  # AWS-managed key alias/aws/sns has a fixed key policy that cannot be
  # modified, so a customer-managed KMS key is required. See:
  # https://docs.aws.amazon.com/social-messaging/latest/userguide/managing-event-destinations-add.html#encrypted-amazon-sns-topic-policies
  WhatsAppTopicEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "CMK for WhatsAppAWSTopic SSE; grants End User Messaging Social publish access."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Required root statement so the account isn't locked out of the key.
          - Sid: AllowRootAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          # Lets End User Messaging Social encrypt inbound WhatsApp messages
          # before publishing them to the SNS topic. Conditions scope this to
          # this account's social-messaging resources only.
          - Sid: AllowEndUserMessagingSocialPublish
            Effect: Allow
            Principal:
              Service: "social-messaging.amazonaws.com"
            Action:
              - "kms:GenerateDataKey*"
              - "kms:Decrypt"
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:social-messaging:${AWS::Region}:${AWS::AccountId}:*"


  # SNS that will invoke lambda function
  WhatsAppAWSTopic:
    Type: AWS::SNS::Topic
    DependsOn:
      - WhatsAppLambdaProcessor
    Properties:
      KmsMasterKeyId: !Ref WhatsAppTopicEncryptionKey
      Subscription:
        - Endpoint: !GetAtt WhatsAppLambdaProcessor.Arn
          Protocol: "lambda"
      TopicName: "WhatsAppAWSTopic"
      DisplayName: "WhatsAppAWSTopic"


  # Non-conformity cases + expert validation workflow
  CasesDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "NonConformityCases"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: "case_id"
          KeyType: "HASH"
      AttributeDefinitions:
        - AttributeName: "case_id"
          AttributeType: "S"
        - AttributeName: "created_by"
          AttributeType: "S"
        - AttributeName: "status"
          AttributeType: "S"
      GlobalSecondaryIndexes:
        - IndexName: "created_by-index"
          KeySchema:
            - AttributeName: "created_by"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"
        - IndexName: "status-index"
          KeySchema:
            - AttributeName: "status"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"


##########################################################################################
### Outputs
#########################################################################################
Outputs:
  WhatsAppAWSTopicArn:
    Description: The ARN of the created SNS topic
    Value: !Ref WhatsAppAWSTopic