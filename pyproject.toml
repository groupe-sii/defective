[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-fintech"
version = "0.1.0"
description = "Multichannel conformity assistant on Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "colorama>=0.4.6",
]

# Local-only tooling.
#
# `botocore[crt]` — needed by boto3 when credentials come from `aws login`
# (otherwise: "Using the login credential provider requires an additional
# dependency").
#
# `strands-agents` and `urllib3` back local agent runs; the Runtime image gets
# its own pinned set from patterns/<pattern>/requirements.txt.
[dependency-groups]
dev = [
    "botocore[crt]>=1.43.0",
    "strands-agents>=1.61.1",
    "urllib3>=2.6.0",
]

# Keep the editable install (`uv pip install -e . --no-deps` in the pattern
# Dockerfiles) from mistaking sibling directories for packages. Without this,
# setuptools' flat-layout auto-discovery finds `gateway/` and the Dockerfile's
# `agentcore_tools/` (a rename of `tools/`) and refuses to build:
#   "error: Multiple top-level packages discovered in a flat-layout:
#    ['gateway', 'agentcore_tools']"
# Upstream FAST ships exactly this section; do not drop it.
[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "scripts*"]
exclude = ["tests*", "infra-cdk*", "frontend*", "patterns*"]
