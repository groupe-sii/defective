[project]
name = "whatsapp-fintech"
version = "0.1.0"
description = "Multichannel conformity assistant on Amazon Bedrock AgentCore"
readme = "README.md"
dependencies = [
    "strands-agents>=1.61.1",
    "urllib3>=2.6.0",
]

# Local-only tooling.
#
# `botocore[crt]` — needed by boto3 when credentials come from `aws login`
# (otherwise: "Using the login credential provider requires an additional
# dependency").
#
# The rest back the operator scripts under scripts/ and test-scripts/:
#   boto3      — every script talks to AWS
#   PyYAML     — scripts/utils.py and seed-contacts.py read infra-cdk/config.yaml
#   colorama   — scripts/utils.py's print_msg/print_section
#   requests   — scripts/utils.py's authenticate_cognito
[dependency-groups]
dev = [
    "botocore[crt]>=1.43.0",
    "boto3>=1.34.0",
    "PyYAML>=6.0.1",
    "colorama>=0.4.6",
    "requests>=2.31.0",
]
