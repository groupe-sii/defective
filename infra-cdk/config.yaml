stack_name_base: conformity-agent

# Optional: Set to automatically create an admin user and email credentials
# If not provided, you'll need to manually create users via AWS Console
admin_user_email: # Example: admin@example.com

backend:
  agent_name: ConformityAgent # Name for the agent runtime (a-z, A-Z, 0-9, _)
  pattern: conformity-agent # See patterns/ for available options
  # Pattern prefix determines the frontend parser:
  #   agui-*      → AG-UI parser      (e.g. agui-strands-agent)
  #   strands-*   → Strands parser    (e.g. strands-single-agent)
  #   langgraph-* → LangGraph parser  (e.g. langgraph-single-agent)
  #   claude-*    → Claude parser     (e.g. claude-agent-sdk-single-agent)
  # The folder name must match exactly and start with the desired parser prefix.
  # NOTE: conformity-agent uses the Strands parser conventions (tools/ + basic_agent.py).
  deployment_type: docker # Available deployment types: docker (default), zip (not supported for claude-agent-sdk)
  network_mode: PUBLIC # Available network modes: PUBLIC (default), VPC

  # Long-term memory uses a SemanticMemoryStrategy to extract and store facts across sessions.
  # This incurs additional costs: $0.75/1,000 records stored + $0.50/1,000 retrieval calls.
  # Set to true when you want to try persistent cross-session memory, which is keyed off of the
  # Cognito userId.
  use_long_term_memory: false
  ltm_top_k: 10             # Number of facts to retrieve per turn (default: 10)
  ltm_relevance_score: 0.3  # Minimum similarity threshold for retrieval (default: 0.3)

  # MCP server discovery + auto-connect from an AWS Agent Registry.
  # Lightweight: no DynamoDB, no UI, no per-user preferences. When enabled, the
  # agent lists the registry's Approved MCP records at runtime and connects to
  # each public streamable-HTTP server as a live MCP client (their tools become
  # directly callable). See docs/MCP_REGISTRY_DISCOVERY.md.
  mcp_registry:
    enabled: false        # Default off. Set true to activate discovery + auto-connect.
    registry_id: ""       # ARN or id of the AWS Agent Registry. Required when enabled.

  # VPC configuration - required when network_mode is VPC
  # Your VPC must have the necessary VPC endpoints for AWS services.
  # See docs/DEPLOYMENT.md for the full list of required VPC endpoints.
  # vpc:
  #   vpc_id: vpc-0abc1234def56789a
  #   subnet_ids:
  #     - subnet-aaaa1111bbbb2222c
  #     - subnet-cccc3333dddd4444e
  #   security_group_ids:  # Optional - a default SG is created if omitted
  #     - sg-0abc1234def56789a

# ============================================================================
# Conformity-assistant domain configuration
# ============================================================================
conformity:
  # Region the whole conformity stack deploys to. MUST match CDK_DEFAULT_REGION
  # at deploy time (AgentCore Runtime, Gateway, Memory and the KB all live here).
  region: eu-west-1

  # Bedrock model used by the agent. eu.amazon.nova-pro-v1:0 is an inference
  # profile valid in eu-west-1 (us.* profiles are rejected there).
  model_id: eu.amazon.nova-pro-v1:0

  # Bedrock Knowledge Base holding past Non-Conformity Reports (NCRs).
  # Seeded with the dataset images *and* the 92 synthetic text NCRs from
  # data/ncr_cable_synthetiques_bundle/ (see scripts/ingest-ncr-text.py).
  knowledge_base_id: GXY5L19KJX

  # Locale of the agent prompts. Supported: en_US, pt_BR, fr_FR.
  locale: en_US

  # Enforcement mode of the AgentCore policy engine attached to the Gateway.
  #   ENFORCE  - Cedar decisions are real: a technician's tools/list omits
  #              record_validation, and any denied call fails.
  #   LOG_ONLY - decisions are only traced (no denial). Use it to validate a
  #              policy change before it can break the demo.
  # The Cedar statements live in gateway/policies/policy.cedar.
  policy_engine_mode: ENFORCE

  # Stream the model response (Bedrock ConverseStream) or not (Converse).
  # false is the reliable setting for Nova Pro: under streaming it intermittently
  # aborts a tool-using turn with
  #   modelStreamErrorException: Model produced invalid sequence as part of
  #   ToolUse
  # which reaches the technician as "please resend". The same prompt and tool
  # schema succeed on the non-streaming path. The runtime still streams its own
  # SSE events either way (Strands synthesises them from the Converse response),
  # so the channel handler is unaffected.
  streaming: false

  # Channels answered in demo mode (CSV). A channel listed here logs the reply
  # (MOCK_<CHANNEL>: reply to <identity>: ...) instead of sending it. Remove a
  # channel to send for real (requires the channel to be provisioned).
  mock_channels: whatsapp,email,rcs

  # When true, send_contractor_email logs (MOCK_EMAIL ...) instead of using SES.
  mock_email: true

  # Outbound e-mail envelope for the contractor notification.
  contractor_email_from: noreply@example.com

  # SMS delivery via AWS End User Messaging (pinpoint-sms-voice-v2).
  # `origination_identity` is a phone-number id/ARN, a pool id, or a *sender ID*.
  #
  # The demo runs on the EUM **SMS simulator**: messages never touch a carrier,
  # EUM records realistic delivery events, and no phone number has to be
  # purchased or verified. Constraint: an origination simulator exists only in
  # the US and can only message US destination simulators, so both demo
  # identities below are US numbers (a French number is impossible with the
  # simulator: `INVALID_IDENTITY_FOR_DESTINATION_COUNTRY`).
  #
  # EUM has no single origination that reaches every country, so the dispatcher
  # picks by destination country: `origination_by_country` wins, the simulator
  # is the fallback. That is what lets one deploy text the real French phone
  # (via CONFORMITE) *and* the US simulator identities.
  sms:
    origination_identity: phone-87bc52bcebf244de87fda9b90c42fec1  # +1 206 555 2684
    message_type: TRANSACTIONAL
    origination_by_country:
      # France: alphanumeric sender ID, $0/month, no registration required.
      # Only rule (since 2026-03-01): a-z A-Z 0-9, no dashes.
      FR: arn:aws:sms-voice:eu-west-1:160885249481:sender-id/CONFORMITE/FR
    # Demo identities (digits only). A `+1 425…` number is an EUM simulator
    # destination; a `+33…` number is a real handset that must first be verified
    # in the sandbox (scripts/provision-sms.py --add/--verify).
    #
    # Default is the simulator "success" destination: it needs no phone, no OTP
    # and no carrier, so the demo works out of the box. To show a real SMS on a
    # handset instead, swap the technician for your verified French number:
    #     technician: "33670022195"
    # The dispatcher then sends from CONFORMITE automatically (see
    # origination_by_country above) - no other change needed.
    demo_identities:
      technician: "14254147755"  # US "success" simulator destination
      expert: "5511999998888"    # seeded expert (receives the notification mirror)

  # Expert phone numbers (digits only), used to seed the contacts mapping table.
  # These are the numbers allowed to approve/reject a drafted procedure.
  expert_contacts:
    - "5511999998888"
